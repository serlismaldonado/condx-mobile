[package]
name = "nsh-app-condx-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.2.0"
nsh-base = "0.2.0"
env_logger = "0.11"
# El motor local-first (el mismo del daemon) y la firma del teléfono.
localfirst-core = { path = "../localfirst/rust/localfirst-core" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
# La identidad de cifrado del teléfono (age X25519): el daemon le cifra las claves de los proveedores.
age = { version = "0.12", features = ["armor"] }
# Leer el QR de la Mac en una foto (scan.rs).
rqrr = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rxing = { version = "0.9", default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }
log = "0.4"

# Dónde vive la identidad del teléfono: Keychain en iOS, Keystore en Android (en el escritorio, un archivo de prueba).
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.2.0", default-features = false }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
